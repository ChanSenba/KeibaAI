[project]
name = "keibaai"
version = "0.1.0"
description = "JRA race result collector and predictor (personal use)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0", "pandas>=2.0", "numpy>=1.26", "lightgbm>=4.0", "streamlit>=1.50"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
keibaai = "keibaai.cli:main"
keibaai-gui = "keibaai.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
